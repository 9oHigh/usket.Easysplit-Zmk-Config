name: Commit attribution

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    name: Verify commit identities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check branch history or new pull request commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected_name='9oHigh'
          expected_email='usket@icloud.com'
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            commits="$(git rev-list "$PR_HEAD" --not "$PR_BASE")"
          else
            commits="$(git rev-list "$PUSH_HEAD")"
          fi

          if [[ -z "$commits" ]]; then
            echo 'No commits to check.'
            exit 0
          fi
          failed=0
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            IFS=$'\t' read -r author_name author_email committer_name committer_email < <(git show -s --format='%an%x09%ae%x09%cn%x09%ce' "$commit")
            author_email="$(printf '%s' "$author_email" | tr '[:upper:]' '[:lower:]')"
            committer_email="$(printf '%s' "$committer_email" | tr '[:upper:]' '[:lower:]')"
            if [[ "$author_name" != "$expected_name" || "$author_email" != "$expected_email" ]]; then
              echo "Commit $commit author is $author_name <$author_email>; expected $expected_name <$expected_email>." >&2
              failed=1
              continue
            fi
            if [[ "$committer_name" == "$expected_name" && "$committer_email" == "$expected_email" ]]; then
              continue
            elif [[ "$committer_name" == 'GitHub' && "$committer_email" == 'noreply@github.com' ]]; then
              continue
            else
              echo "Commit $commit committer is $committer_name <$committer_email>; expected $expected_name <$expected_email> or GitHub web operation." >&2
              failed=1
            fi
          done <<< "$commits"
          if [[ "$failed" -ne 0 ]]; then
            echo 'Commit attribution check failed.' >&2
            exit 1
          fi
          echo 'All commits use the configured GitHub identity.'
