# ZMK 클라우드 빌드 매트릭스 (GitHub Actions)
# 보드: Seeed Studio XIAO BLE (nRF52840) -> ZMK 보드명 xiao_ble
# 각 항목이 하나의 .uf2 펌웨어를 생성한다.
include:
  # 단일 보드 검증/제품용
  - board: xiao_ble
    shield: easysplit_1key
  - board: xiao_ble
    shield: easysplit_4key

  # 좌우 무선 스플릿 (left = central)
  - board: xiao_ble
    shield: easysplit_split_2x2_left
  - board: xiao_ble
    shield: easysplit_split_2x2_right

  # 설정 초기화 펌웨어 (BLE 페어링 정보 삭제용 - 출고/AS 시 유용)
  - board: xiao_ble
    shield: settings_reset
